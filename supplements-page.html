<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Catálogo de suplementos | Javy Suplementos</title>

    <!--
      El catálogo se mudó a /catalogo/. Esta página queda como puente para las
      URLs ya indexadas y para los enlaces viejos compartidos por WhatsApp.

      El redirect REAL es un 301 en Cloudflare (docs/seguridad-cloudflare.md §2.8);
      GitHub Pages no puede emitir un 301 por sí solo. Este archivo es la red de
      seguridad para la ventana entre el deploy y el alta de esa regla.

      noindex + canonical: si Google llega igual, que no indexe esta URL y le
      pase toda la señal a /catalogo/.
    -->
    <link rel="canonical" href="https://javysuplementos.com/catalogo/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=/catalogo/" />

    <!-- El meta refresh de arriba pierde el query string; este script lo conserva.
         Externo y no inline por la CSP (script-src 'self'). -->
    <script src="/js/redir-catalogo.js?v=catalogo-1"></script>
  </head>
  <body>
    <p>El catálogo ahora vive en <a href="/catalogo/">javysuplementos.com/catalogo/</a>.</p>
  </body>
</html>
