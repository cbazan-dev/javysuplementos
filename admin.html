<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Seguridad: CSP baseline versionada. El enforce real + frame-ancestors lo aplica Cloudflare (ver docs/seguridad-cloudflare.md). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://fodwjfiyfmscklqsqrip.supabase.co; connect-src 'self' https://cdn.jsdelivr.net https://fodwjfiyfmscklqsqrip.supabase.co wss://fodwjfiyfmscklqsqrip.supabase.co https://cloudflareinsights.com" />
    <title>Admin | Javy Suplementos</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#050709" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/javy-favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="any" href="/img/icons/javy-favicon-cejas-color-correcto-1024.png?v=2" />
    <link rel="apple-touch-icon" href="/img/icons/javy-app-icon-ios-ipados-1024.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- tokens + card pública: para renderizar la card real de la tienda en la
         vista previa del formulario de producto (Fase 3). -->
    <link rel="stylesheet" href="css/tokens.css?v=fase3-preview" />
    <link rel="stylesheet" href="css/components/cards.css?v=fase3-preview" />
    <link rel="stylesheet" href="css/admin-dashboard.css?v=manual-product-editor" />
    <link rel="stylesheet" href="css/dropdown.css?v=4" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-config.js" defer></script>
    <script src="js/whatsapp-config.js?v=central-links" defer></script>
    <script src="js/product-data.js" defer></script>
    <script src="js/db.js?v=fase6-actividad" defer></script>
    <script src="js/auth.js?v=session-guard" defer></script>
    <script src="js/icons.js?v=cat-icons-4" defer></script>
    <script src="js/dropdown.js?v=4" defer></script>
    <!-- Generación de PDF de los informes (vendorizado, sin depender de CDN en vivo) -->
    <script src="js/vendor/jspdf.umd.min.js?v=1" defer></script>
    <script src="js/vendor/jspdf.plugin.autotable.min.js?v=1" defer></script>
    <!-- Token de versión del panel (?v=adm-...): hace que el grafo de módulos
         js/admin/** se baje completo y consistente, sin mezclar versiones nuevas
         y viejas desde la caché. NO se edita a mano: lo recalcula y reescribe
         scripts/bump-admin-version.mjs (lo corre solo scripts/guardar.sh).
         boot-guard.js carga main.js con import() dinámico para mostrar un error
         con botón Reintentar si algo falla (antes quedaba la pantalla en negro). -->
    <script src="js/admin/boot-guard.js?v=adm-b0d853ee" defer></script>
  </head>
  <body class="ad-body">
    <div class="ad-app" data-anim="on" id="adminApp">
      <!-- Gate de acceso -->
      <section class="ad-gate" id="adminGate" aria-live="polite">
        <div class="ad-gate__card">
          <img src="img/icons/logo.png" alt="Javy Supplements" />
          <p class="ad-gate__kicker">Panel privado</p>
          <h1>Validando acceso</h1>
          <p id="adminGateMessage">Revisando sesión y permisos de administrador…</p>
          <span class="ad-gate__loader" aria-hidden="true"></span>
          <div class="ad-gate__error" id="adminGateError" hidden>
            <button class="ad-btn ad-btn--primary" id="adminGateRetry" type="button">Reintentar</button>
            <p class="ad-gate__error-detail" id="adminGateErrorDetail"></p>
          </div>
        </div>
      </section>

      <!-- Shell (oculto hasta validar admin) -->
      <div class="ad-shell" id="adminShell" hidden>
        <aside class="ad-sidebar" aria-label="Navegación del panel">
          <a class="ad-brand" href="index.html" aria-label="Ir a la tienda">
            <img src="img/icons/logo.png" alt="" />
            <span><strong>Javy</strong><small>Admin</small></span>
          </a>
          <nav class="ad-nav" id="adminNav" aria-label="Secciones"></nav>
          <button class="ad-logout" id="adminLogoutBtn" type="button">
            <span class="ad-ico" data-javy-icon="log-out" aria-hidden="true"></span>
            Cerrar sesión
          </button>
        </aside>

        <main class="ad-main">
          <header class="ad-topbar">
            <div class="ad-topbar__title">
              <h1 id="adminTitle">Dashboard</h1>
              <p id="adminSubtitle">Resumen de la tienda y acciones pendientes</p>
            </div>
          </header>

          <div id="adminView"></div>
        </main>
      </div>

      <!-- Bottom nav (mobile) -->
      <nav class="ad-tabbar" id="adminTabbar" aria-label="Navegación rápida"></nav>

      <!-- Sheet "Más" (mobile) -->
      <div class="ad-sheet" id="adminSheet">
        <div class="ad-sheet__backdrop" data-close-sheet></div>
        <div class="ad-sheet__panel">
          <h3>Más secciones</h3>
          <div class="ad-sheet__grid" id="adminSheetGrid"></div>
        </div>
      </div>

      <!-- Hosts dinámicos -->
      <div id="adminDrawerHost"></div>
      <div id="adminConfirmHost"></div>
      <div class="ad-toast-host" id="adminToastHost" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
