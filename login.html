<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Seguridad: CSP baseline versionada. El enforce real + frame-ancestors lo aplica Cloudflare (ver docs/seguridad-cloudflare.md). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://fodwjfiyfmscklqsqrip.supabase.co; connect-src 'self' https://cdn.jsdelivr.net https://fodwjfiyfmscklqsqrip.supabase.co wss://fodwjfiyfmscklqsqrip.supabase.co https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com" />
    <title>Iniciar sesión | Javy Suplementos</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/javy-favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="any" href="/img/icons/javy-favicon-cejas-color-correcto-1024.png?v=2" />
    <link rel="apple-touch-icon" href="/img/icons/javy-app-icon-ios-ipados-1024.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#050709" />
    <link rel="stylesheet" href="css/base.css?v=fase2-ui" />
    <link rel="stylesheet" href="css/tokens.css?v=fase2-ui" />
    <link rel="stylesheet" href="css/pages/login.css?v=mobile-center" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="js/supabase-config.js" defer></script>
    <script src="js/auth.js?v=session-guard" defer></script>
    <script src="js/icons.js?v=cat-icons" defer></script>
    <script src="js/login.js?v=session-guard" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <a class="login-logo" href="index.html" aria-label="Volver al inicio">
          <img src="img/icons/logo.png" alt="Javy Supplements" />
        </a>

        <div class="login-heading">
          <h1 id="loginTitle">Iniciar sesión</h1>
          <p>Acceso exclusivo para administración.</p>
        </div>

        <section class="login-active" id="loginActiveSession" hidden aria-live="polite">
          <p class="login-active__message">Ya tienes una sesión administrativa activa.</p>
          <div class="login-active__actions">
            <a class="login-submit login-submit--link" href="admin.html">
              <span class="btn-icon" data-javy-icon="layout-dashboard" aria-hidden="true"></span>
              Ir al panel
            </a>
            <button class="login-secondary" id="loginSignOut" type="button">
              <span class="btn-icon" data-javy-icon="log-out" aria-hidden="true"></span>
              <span data-signout-text>Cerrar sesión</span>
            </button>
          </div>
        </section>

        <section class="login-form-wrap" id="loginFormWrap">
          <p class="login-error" id="loginError" hidden aria-live="polite"></p>

          <form class="login-form" id="loginForm" novalidate>
            <label for="loginEmail">
              Correo electrónico
              <input id="loginEmail" name="email" type="email" autocomplete="email" required />
              <small id="loginEmailError"></small>
            </label>

            <label for="loginPassword">
              Contraseña
              <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
              <small id="loginPasswordError"></small>
            </label>

            <!-- Turnstile (anti fuerza bruta). Site key público de Cloudflare; la verificación
                 real la hace Supabase Auth con la secret key. Ver docs/seguridad-cloudflare.md. -->
            <div class="cf-turnstile login-turnstile" data-sitekey="0x4AAAAAADscMJ6jq_yXhCKY" data-theme="dark"></div>

            <button class="login-submit" id="loginSubmit" type="submit">
              <span class="btn-icon" data-javy-icon="log-in" aria-hidden="true"></span>
              <span data-login-text>Iniciar sesión</span>
              <span class="login-spinner" aria-hidden="true"></span>
            </button>
          </form>
        </section>

        <a class="login-back" href="index.html">
          <span class="btn-icon" data-javy-icon="arrow-left" aria-hidden="true"></span>
          Volver al inicio
        </a>
      </section>
    </main>
  </body>
</html>
