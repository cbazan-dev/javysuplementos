    <main class="construccion-shell">
      <section class="construccion-card" aria-labelledby="construccionTitulo">

            rel="noopener"

            Escríbenos por WhatsApp

          <a
            class="btn btn--ghost btn--lg btn--block"
            href="https://instagram.com/javy.suplementos"
            target="_blank"
            rel="noopener"
          >
            <span class="btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="20" x="2" y="2" rx="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37Z"></path>
